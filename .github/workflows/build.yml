# Compila Nebula para Windows, Android y Linux (nebula-server y su imagen de Docker) en cada push / PR.
# - Artefactos: instalador NSIS, ejecutable portable, APK de Android y nebula-server para Linux x64 y arm64
#   (pestaña Actions → ejecución → Artifacts).
# - Cada push a main publica la Release vX.Y.Z de la versión de src-tauri/tauri.conf.json con los dos .exe,
#   el .apk, los dos nebula-server y SHA256SUMS.txt, y la imagen ghcr.io/<dueño>/nebula con las etiquetas
#   latest y vX.Y.Z (amd64 y arm64). Si esa Release ya la creó este workflow, se actualiza con la nueva compilación; si se
#   publicó a mano, no se toca (sube la versión para publicar otra). También funciona subiendo una etiqueta vX.Y.Z.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: test

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar interfaz
        run: npm run build

      - name: Tests del motor y la app (Rust)
        run: cargo test --workspace --locked

      # El motor tiene que compilar sin Tauri (lo usan el servidor y la línea de comandos).
      - name: Motor sin Tauri (nebula-core)
        shell: bash
        run: |
          cargo build -p nebula-core --locked
          if cargo tree -p nebula-core -e normal --prefix none | grep -q '^tauri'; then
            echo "::error::nebula-core depende de Tauri"
            exit 1
          fi

  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: release

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar la versión de la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") {
            Write-Error "La etiqueta ${{ github.ref_name }} no coincide con la versión $v de tauri.conf.json"
            exit 1
          }

      - name: Compilar (tauri build)
        run: npx tauri build --ci

      - name: Preparar ejecutables
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "No se generó el instalador NSIS"; exit 1 }
          Copy-Item $setup.FullName "release/Nebula_${v}_x64-setup.exe"
          Copy-Item target/release/nebula.exe "release/Nebula_${v}_x64_portable.exe"
          Get-ChildItem release | Format-Table Name, Length
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: Nebula_${{ env.VERSION }}_x64
          path: release/*.exe
          if-no-files-found: error

  android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: android

      - name: Preparar el NDK
        run: |
          tc="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME"
            # OpenSSL (compilado junto a la app) busca ar/ranlib con prefijo GNU, que el NDK ya no trae.
            echo "AR_aarch64_linux_android=$tc/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$tc/llvm-ranlib"
          } >> "$GITHUB_ENV"

      # 7-Zip y par2 compilados para Android: solo se recompilan si cambia el script.
      - name: Caché de 7-Zip y par2 para Android
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/gen/android/app/src/main/jniLibs
          key: android-tools-${{ hashFiles('src-tauri/gen/android/build-native-tools.sh') }}

      - name: Compilar 7-Zip y par2 para Android
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: src-tauri/gen/android/build-native-tools.sh

      - name: Instalar dependencias
        run: npm ci

      # Clave de firma: secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y
      # ANDROID_KEY_PASSWORD. Son obligatorios para publicar (main y etiquetas). Sin ellos (PRs de forks) el APK
      # se firma con la clave de depuración: sirve para probar, pero no se instala encima del oficial.
      - name: Clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUBLISHES: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error::Falta ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS o ANDROID_KEY_PASSWORD"
              exit 1
            fi
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nebula.jks"
            {
              echo "NEBULA_KEYSTORE=$RUNNER_TEMP/nebula.jks"
              echo "NEBULA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "NEBULA_KEY_ALIAS=$KEY_ALIAS"
              echo "NEBULA_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Firma con la clave de los secretos"
          elif [ "$PUBLISHES" = "true" ]; then
            echo "::error::Faltan los secretos ANDROID_KEYSTORE_*: no se publica un APK sin la clave de firma oficial"
            exit 1
          else
            echo "::warning::Sin secretos ANDROID_KEYSTORE_*: el APK se firma con la clave de depuración (solo para pruebas)"
          fi

      - name: Compilar (tauri android build)
        run: npx tauri android build --apk --target aarch64 --ci

      - name: Borrar la clave de firma
        if: always()
        run: rm -f "$RUNNER_TEMP/nebula.jks"

      - name: Preparar APK
        run: |
          set -euo pipefail
          v=$(jq -r .version src-tauri/tauri.conf.json)
          mkdir -p release
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -1)
          [ -n "$apk" ] || { echo "::error::No se generó el APK"; exit 1; }
          cp "$apk" "release/Nebula_${v}_android_arm64.apk"
          unzip -l "release/Nebula_${v}_android_arm64.apk" | grep -E 'lib/arm64-v8a/' 
          ls -la release
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Nebula_${{ env.VERSION }}_android
          path: release/*.apk
          if-no-files-found: error

  # nebula-server para Linux: el binario estático y la imagen de Docker salen del mismo Dockerfile,
  # compilado en un runner de cada arquitectura (sin emulación).
  server:
    name: Server Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      PUBLISHES: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v5

      - name: Versión e imagen
        run: |
          echo "VERSION=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nebula" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Compilar nebula-server y la CLI (binarios estáticos)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server-bin
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=out
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}

      - name: Preparar binario
        run: |
          set -euo pipefail
          mkdir -p release
          cp out/nebula-server "release/nebula-server_${VERSION}_linux_${{ matrix.arch }}"
          cp out/nebula "release/nebula_${VERSION}_linux_${{ matrix.arch }}"
          chmod 755 release/*
          file release/*
          "release/nebula-server_${VERSION}_linux_${{ matrix.arch }}" --version
          "release/nebula_${VERSION}_linux_${{ matrix.arch }}" --version

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-server_${{ env.VERSION }}_linux_${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: nebula:ci
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}

      # La imagen arranca, responde a /health, el healthcheck pasa y trae par2 y 7-Zip.
      - name: Probar la imagen
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh nebula:ci -c 'par2 -V && 7zz i | head -2 && nebula-server --version && nebula --version'
          mkdir -p "$RUNNER_TEMP/config" "$RUNNER_TEMP/downloads"
          docker run -d --name neb -p 5080:5080 -e PUID=1001 -e PGID=1001 \
            -v "$RUNNER_TEMP/config:/config" -v "$RUNNER_TEMP/downloads:/downloads" nebula:ci
          for i in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' neb)" = healthy ] && break
            sleep 2
          done
          docker logs neb
          curl -fsS http://127.0.0.1:5080/health
          curl -fsS http://127.0.0.1:5080/ | grep -q '<div id="app">'
          [ "$(docker inspect -f '{{.State.Health.Status}}' neb)" = healthy ]
          [ "$(stat -c %u "$RUNNER_TEMP/config/config.json")" = 1001 ]
          # La CLI dentro del contenedor encuentra el servidor y su clave sola.
          docker exec neb nebula status
          docker exec neb nebula queue --json
          docker stop neb
          [ "$(docker inspect -f '{{.State.ExitCode}}' neb)" = 0 ]

      - name: Entrar en GHCR
        if: env.PUBLISHES == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir la imagen de esta arquitectura
        id: push
        if: env.PUBLISHES == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=server-${{ matrix.arch }}

      - name: Guardar el digest
        if: env.PUBLISHES == 'true'
        run: |
          mkdir -p digests
          d="${{ steps.push.outputs.digest }}"
          touch "digests/${d#sha256:}"

      - uses: actions/upload-artifact@v4
        if: env.PUBLISHES == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  docker:
    name: Publicar imagen Docker
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Una sola etiqueta para amd64 y arm64: latest y vX.Y.Z.
      - name: Etiquetar latest y la versión
        run: |
          set -euo pipefail
          v=$(jq -r .version src-tauri/tauri.conf.json)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nebula"
          docker buildx imagetools create -t "$image:latest" -t "$image:v$v" \
            $(cd digests && printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:v$v"
          echo "::notice::Imagen publicada: $image:v$v y $image:latest"

  release:
    name: Publicar release
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, build, android, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: Nebula_*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: nebula-server_*
          merge-multiple: true

      - name: Publicar o actualizar la release de esta versión
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          v=$(jq -r .version src-tauri/tauri.conf.json)
          tag="v$v"
          short="${GITHUB_SHA::7}"
          (cd release && sha256sum *.exe *.apk nebula-server_* nebula_* > SHA256SUMS.txt)
          cat > notes.md <<EOF
          <!-- nebula-autobuild -->
          Automatic build of **Nebula $v** from commit [\`$short\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA).

          | File | What it's for |
          |---|---|
          | \`Nebula_${v}_x64-setup.exe\` | Installer: shortcut, uninstaller and \`.nzb\` file association. |
          | \`Nebula_${v}_x64_portable.exe\` | A single executable, no installation. Stores its data in \`%APPDATA%\\Nebula\`. |
          | \`Nebula_${v}_android_arm64.apk\` | Android app (arm64, Android 7.0 or later). Open it on the phone to install it. |
          | \`nebula-server_${v}_linux_x64\`, \`nebula-server_${v}_linux_arm64\` | nebula-server for Linux servers and NAS: web interface and SABnzbd/Newznab APIs. A single static binary; see [docs/SERVER.md](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/SERVER.md). |
          | \`nebula_${v}_linux_x64\`, \`nebula_${v}_linux_arm64\` | The \`nebula\` command line: control nebula-server or download an NZB on its own; see [docs/CLI.md](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/CLI.md). |
          | \`SHA256SUMS.txt\` | SHA-256 checksums to verify the files. |

          Docker: \`docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nebula:v$v\` (amd64 and arm64), see [docs/DOCKER.md](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/DOCKER.md).

          Requirements: Windows 10/11 x64 with WebView2 (included in Windows 11; the installer downloads it if missing). Android 7.0+ on a 64-bit ARM phone or tablet.
          EOF
          if gh release view "$tag" --json body -q .body > current.md 2>/dev/null; then
            if ! grep -q "nebula-autobuild" current.md; then
              echo "::notice::La release $tag ya existe y se publicó a mano, así que no se modifica. Sube la versión (src-tauri/tauri.conf.json, Cargo.toml y package.json) para publicar otra."
              exit 0
            fi
            # Misma versión: la etiqueta pasa a este commit y se sustituyen los archivos.
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              git tag -f "$tag" "$GITHUB_SHA"
              git push -f origin "refs/tags/$tag"
            fi
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --notes-file notes.md
            echo "::notice::Release $tag actualizada con el commit $short"
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --title "Nebula $v" --notes-file notes.md --latest
            echo "::notice::Release $tag publicada"
          fi
