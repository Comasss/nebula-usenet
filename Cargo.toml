# Workspace de Nebula:
# - crates/nebula-core: el motor (cola, NNTP, post-procesado, API, RSS…), sin Tauri.
# - crates/nebula-server: el motor con interfaz web, sin ventana (servidores, NAS, Docker).
# - crates/nebula-cli: la línea de comandos (controla nebula-server o descarga un NZB sola).
# - src-tauri: la app de escritorio y Android (Tauri) sobre nebula-core.
# - dev/nntp-bench: servidor NNTP simulado rápido para dev/bench.py (no se publica).
[workspace]
resolver = "2"
members = ["crates/nebula-core", "crates/nebula-server", "crates/nebula-cli", "src-tauri", "dev/nntp-bench"]

[workspace.package]
version = "1.10.1"
authors = ["Genis"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Comasss/nebula-usenet"
edition = "2021"

[workspace.dependencies]
nebula-core = { path = "crates/nebula-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip", "multipart", "stream"] }
parking_lot = "0.12"
base64 = "0.22"
sha2 = "0.10"
libc = "0.2"
windows-sys = "0.59"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
