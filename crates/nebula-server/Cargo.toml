[package]
name = "nebula-server"
description = "Nebula sin ventana: el motor con interfaz web y las APIs Newznab y SABnzbd, para servidores, NAS y Docker"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[[bin]]
name = "nebula-server"
path = "src/main.rs"

[dependencies]
nebula-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
parking_lot.workspace = true
base64.workspace = true
sha2.workspace = true
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
# La interfaz (dist/) va dentro del ejecutable en release; en debug se lee del disco.
rust-embed = "8"
mime_guess = "2"
argon2 = "0.5"
hmac = "0.12"
dirs = "6"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
