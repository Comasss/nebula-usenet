[package]
name = "nebula-core"
description = "Motor de Nebula: cola, NNTP, post-procesado, categorías, APIs Newznab y SABnzbd, RSS y control remoto, sin Tauri"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lib]
name = "nebula_core"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
parking_lot.workspace = true
base64.workspace = true
sha2.workspace = true
tokio-native-tls = "0.3"
native-tls = "0.2"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
roxmltree = "0.20"
crc32fast = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
flate2 = "1"
md-5 = "0.10"
# Hora local para el programador y el reinicio de las cuotas.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Pasar los ajustes a otro dispositivo: QR y cifrado del envío por la red local.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
chacha20poly1305 = "0.10"
# Control remoto desde el móvil: intercambio de claves al emparejar.
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
# Android no trae OpenSSL: se compila junto a la app.
openssl = { version = "0.10", features = ["vendored"] }
