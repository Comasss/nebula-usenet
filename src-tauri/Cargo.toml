[package]
name = "nebula"
version.workspace = true
description = "Nebula — a modern Usenet (NZB) client for Windows, Linux, macOS and Android"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lib]
name = "nebula_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nebula-core.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
parking_lot.workspace = true
base64.workspace = true
sha2.workspace = true
futures-util = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
winreg = "0.55"
clipboard-win = "5"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# La clave de las contraseñas en el llavero del sistema (Llavero de macOS, libsecret en Linux).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# Notificaciones y portapapeles en Linux y macOS.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-notification = "2"
arboard = { version = "3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
